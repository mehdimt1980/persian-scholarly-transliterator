name: Phase 8G persistent staging import readiness
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.label.name == 'phase8g-verify-staging-import' && github.event.pull_request.number == 61 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase8g/staging-first-persistent-import'
    runs-on: ubuntu-latest
    environment: phase8g-staging-readonly
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read-only staging import readiness
        run: npm run evidence:staging:import -- verify
        env:
          PHASE8G_STAGING_DATABASE_URL: ${{ secrets.PHASE8G_STAGING_DATABASE_URL }}
          PHASE8G_STAGING_DATABASE_FINGERPRINT: ${{ vars.PHASE8G_STAGING_DATABASE_FINGERPRINT }}
          PHASE8G_STAGING_BLOB_STORE_ID: ${{ vars.PHASE8G_STAGING_BLOB_STORE_ID }}
