name: Phase 8G persistent staging audit (read only)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.label.name == 'phase8g-run-persistence-audit' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase8g/staging-persistence-audit'
    runs-on: ubuntu-latest
    environment: phase8g-staging-readonly
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check permanent BSB evidence integrity without mutation
        run: npm run evidence:staging:audit
        env:
          PHASE8G_STAGING_DATABASE_URL: ${{ secrets.PHASE8G_STAGING_DATABASE_URL }}
          PHASE8G_STAGING_DATABASE_FINGERPRINT: ${{ vars.PHASE8G_STAGING_DATABASE_FINGERPRINT }}
