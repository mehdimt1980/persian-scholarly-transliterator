name: Phase 8H targeted BSB discovery (read only)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  targeted-discovery:
    if: github.event.label.name == 'phase8h-run-targeted-discovery' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase8h/targeted-persian-sru-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read-only targeted BSB SRU comparison
        run: npm run acquire:bsb:targeted
