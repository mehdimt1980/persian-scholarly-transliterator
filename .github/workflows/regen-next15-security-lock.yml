name: Regenerate Next 15 security lock

on:
  push:
    branches:
      - security/next15-maintenance-lts

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: security/next15-maintenance-lts

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install patched maintained framework line
        run: >-
          npm install --save-exact
          next@15.5.27
          react@19.3.0
          react-dom@19.3.0
          eslint-config-next@15.5.27
          @types/react@latest
          @types/react-dom@latest

      - name: Unit tests
        run: npm test

      - name: Frozen V2 regression
        run: npm run validate:v2-regression

      - name: Release portability gate
        run: npm run validate:portability

      - name: Existing pilot corpus
        run: npm run validate:corpus

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: High and critical dependency audit
        run: npm audit --audit-level=high

      - name: Commit generated dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(security): upgrade Next.js maintenance LTS"
          git push origin HEAD:security/next15-maintenance-lts
