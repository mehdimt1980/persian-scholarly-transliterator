name: Regenerate secure Next 16 dependency state

on:
  push:
    branches:
      - security/next16-active-lts-clean

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: security/next16-active-lts-clean

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install patched framework and test tooling
        run: >-
          npm install --save-exact
          next@16.3.8
          react@19.3.0
          react-dom@19.3.0
          vitest@4.1.11
          @types/react@latest
          @types/react-dom@latest

      - name: Install development-only linter
        run: npm install --save-dev --save-exact oxlint@1.86.0

      - name: Remove vulnerable legacy lint toolchain
        run: |
          npm uninstall eslint eslint-config-next
          npm pkg set scripts.lint="oxlint src"
          rm -f .eslintrc.json

      - name: Unit tests
        run: npm test

      - name: Frozen V2 regression
        run: npm run validate:v2-regression

      - name: Release portability gate
        run: npm run validate:portability

      - name: Existing pilot corpus
        run: npm run validate:corpus

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: High and critical dependency audit
        run: npm audit --audit-level=high

      - name: Commit generated dependency and migration state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(security): keep release tooling development-only"
          git push origin HEAD:security/next16-active-lts-clean
