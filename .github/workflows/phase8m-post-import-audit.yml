name: Phase 8M post-import integrity and rollback audit (read only)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  post-import-audit:
    if: github.event.label.name == 'phase8m-post-import-audit' && github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase8m/first-frozen-staging-import'
    runs-on: ubuntu-latest
    environment: phase8g-staging-readonly
    timeout-minutes: 5
    env:
      PHASE8G_STAGING_DATABASE_URL: ${{ secrets.PHASE8G_STAGING_DATABASE_URL }}
      PHASE8G_STAGING_DATABASE_FINGERPRINT: ${{ vars.PHASE8G_STAGING_DATABASE_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify active 50-record 75-candidate snapshot, prior rollback and disabled writes
        run: npm run evidence:staging:audit
