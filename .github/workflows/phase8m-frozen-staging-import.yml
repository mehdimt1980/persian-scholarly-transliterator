name: Phase 8M first frozen BSB staging import (one-time guarded)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  actions: read
jobs:
  import-frozen-staging:
    if: github.event.label.name == 'phase8m-authorize-first-frozen-import' && github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase8m/first-frozen-staging-import'
    runs-on: ubuntu-latest
    environment: phase8g-staging-import
    timeout-minutes: 18
    concurrency:
      group: phase8g-persistent-staging-writes
      cancel-in-progress: false
    env:
      PHASE8G_STAGING_DATABASE_URL: ${{ secrets.PHASE8G_STAGING_DATABASE_URL }}
      PHASE8G_STAGING_DATABASE_FINGERPRINT: ${{ vars.PHASE8G_STAGING_DATABASE_FINGERPRINT }}
      PHASE8G_STAGING_BLOB_STORE_ID: ${{ vars.PHASE8G_STAGING_BLOB_STORE_ID }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.PHASE8G_STAGING_BLOB_READ_WRITE_TOKEN }}
      PHASE8G_STAGING_IMPORT_APPROVED: IMPORT_AUTHENTIC_BSB_STAGING
      PHASE8M_STAGING_IMPORT_APPROVED: IMPORT_FROZEN_BSB_48_STAGING
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify original Staging snapshot unchanged and binding disabled
        run: npm run evidence:staging:audit
      - name: Download frozen Phase 8L BSB packet from pinned prior successful run
        uses: actions/download-artifact@v4
        with:
          name: phase8l-frozen-bsb-48-records-review-only
          run-id: 37987627001
          github-token: ${{ github.token }}
          path: artifacts/phase8l-frozen
      - name: Independently replay cryptographic evidence seal
        run: npm run evidence:bsb:verify-frozen
      - name: Check new-only 48-record package against exact permanent Staging target (NO WRITES)
        run: npm run evidence:staging:import-frozen -- verify
      - name: Explicit one-time import authorization contract
        run: |
          test "$PHASE8M_STAGING_IMPORT_APPROVED" = "IMPORT_FROZEN_BSB_48_STAGING"
          test -n "$BLOB_READ_WRITE_TOKEN"
      - name: Enable exact Staging write binding
        id: enable
        run: npm run evidence:staging:write-window -- enable
      - name: Persist immutable source pages and publish incremental 50-record/75-candidate Staging snapshot
        id: import
        run: npm run evidence:staging:import-frozen -- import
      - name: Disable Staging writes on every path after enable
        if: ${{ always() && steps.enable.outcome != 'skipped' }}
        run: npm run evidence:staging:write-window -- disable
      - name: Audit imported snapshot after write window is closed
        if: ${{ steps.import.outcome == 'success' }}
        run: npm run evidence:staging:import-frozen -- audit
      - name: Verify disabled write binding regardless of import outcome
        if: ${{ always() && steps.enable.outcome != 'skipped' }}
        run: |
          npm run evidence:staging:write-window -- status | grep '"writesEnabled":false'
