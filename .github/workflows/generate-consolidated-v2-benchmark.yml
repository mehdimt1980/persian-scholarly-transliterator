name: Generate consolidated V2 benchmark

on:
  push:
    branches:
      - phase4.6b/consolidate-v2-benchmark
    paths:
      - src/validation/review/consolidateV2Benchmark.ts
      - src/validation/review/consolidateV2BenchmarkCli.ts
      - src/validation/v2/types.ts
      - src/validation/v2/schema.ts
      - package.json
      - .github/workflows/generate-consolidated-v2-benchmark.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase4.6b/consolidate-v2-benchmark
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate deterministic V2 benchmark artifact
        run: npm run build:v2-benchmark
      - name: Validate generated artifact
        run: npm run validate:v2-benchmark
      - name: Commit generated artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/corpus/phase4.6b-external-benchmark.v2.json
          git diff --cached --quiet && exit 0
          git commit -m "data(validation): generate consolidated V2 benchmark"
          git push origin HEAD:phase4.6b/consolidate-v2-benchmark
