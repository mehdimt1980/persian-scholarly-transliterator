name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate acquisition corpus
        run: npm run validate:acquisition

      - name: Validate scholarly adjudication
        run: npm run validate:adjudication

      - name: Validate V2 re-audit worklist
        run: npm run validate:reaudit-worklist

      - name: Validate consolidated V2 benchmark
        run: npm run validate:v2-benchmark

      - name: Validate frozen V2 gold
        run: npm run validate:gold-freeze

      - name: Run Phase 4.6C frozen evaluation
        run: npm run evaluate:v2-frozen

      - name: Validate frozen V2 post-remediation regression
        run: npm run validate:v2-regression

      - name: Validate release portability and anti-overreach
        run: npm run validate:portability

      - name: Validate existing validation corpus
        run: npm run validate:corpus

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
