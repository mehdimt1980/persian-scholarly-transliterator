name: Phase 8J BSB staging read-only source/version comparison
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  staging-bsb-diff:
    if: github.event.label.name == 'phase8j-run-staging-diff' && github.event.pull_request.number == 68 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase8j/bsb-staging-diff'
    runs-on: ubuntu-latest
    environment: phase8g-staging-readonly
    timeout-minutes: 9
    concurrency:
      group: phase8j-staging-readonly-diff
      cancel-in-progress: false
    env:
      PHASE8G_STAGING_DATABASE_URL: ${{ secrets.PHASE8G_STAGING_DATABASE_URL }}
      PHASE8G_STAGING_DATABASE_FINGERPRINT: ${{ vars.PHASE8G_STAGING_DATABASE_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact Staging baseline and build BSB read-only diff
        run: npm run evidence:staging:bsb-diff
      - name: Upload source proofs and diff (short-lived, no secrets)
        uses: actions/upload-artifact@v4
        with:
          name: phase8j-bsb-staging-readonly-diff
          path: artifacts/phase8j-bsb-staging-diff/
          retention-days: 7
          if-no-files-found: error
