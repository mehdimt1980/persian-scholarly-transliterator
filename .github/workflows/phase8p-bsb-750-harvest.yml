name: Phase 8P BSB scale to 750 evidence harvest (read only)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  scale-harvest:
    if: github.event.label.name == 'phase8p-bsb-harvest-750' && github.event.pull_request.number == 75 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase8p/bounded-bsb-750-acquisition'
    runs-on: ubuntu-latest
    environment: phase8g-staging-readonly
    timeout-minutes: 18
    env:
      PHASE8G_STAGING_DATABASE_URL: ${{ secrets.PHASE8G_STAGING_DATABASE_URL }}
      PHASE8G_STAGING_DATABASE_FINGERPRINT: ${{ vars.PHASE8G_STAGING_DATABASE_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify existing Staging snapshot and closed write gate
        run: npm run evidence:staging:audit
      - name: Collect bounded real BSB source and verify frozen scale seal
        run: npm run evidence:bsb:scale750
      - name: Export complete immutable SRU source and frozen review candidates
        uses: actions/upload-artifact@v4
        with:
          name: phase8p-bsb-750-source-frozen
          path: artifacts/phase8p-bsb-750-freeze/
          retention-days: 30
          if-no-files-found: error
      - name: Verify unchanged Staging source after harvest
        if: always()
        run: npm run evidence:staging:audit
