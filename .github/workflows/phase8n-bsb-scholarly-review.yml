name: Phase 8N BSB 75-candidate scholarly review queue (read only)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  export-review:
    if: github.event.label.name == 'phase8n-export-scholarly-review' && github.event.pull_request.number == 72 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase8n/bsb-scholarly-review-queue'
    runs-on: ubuntu-latest
    environment: phase8g-staging-readonly
    timeout-minutes: 8
    concurrency:
      group: phase8n-bsb-staging-scholarly-review-readonly
      cancel-in-progress: false
    env:
      PHASE8G_STAGING_DATABASE_URL: ${{ secrets.PHASE8G_STAGING_DATABASE_URL }}
      PHASE8G_STAGING_DATABASE_FINGERPRINT: ${{ vars.PHASE8G_STAGING_DATABASE_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate active snapshot and disabled Neon write binding
        run: npm run evidence:staging:audit
      - name: Export source-linked 75-candidate review packet (zero decisions)
        run: npm run evidence:bsb:review -- export
      - name: Retain human review files for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: phase8n-bsb-scholarly-review-queue
          path: artifacts/phase8n-bsb-scholarly-review/
          retention-days: 30
          if-no-files-found: error
