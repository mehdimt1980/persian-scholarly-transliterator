name: Patch Phrase Decision Sanitization

on:
  push:
    branches:
      - feat/context-aware-phrase-resolver

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/context-aware-phrase-resolver

      - name: Apply sanitization patch
        run: node scripts/patchPhraseDecisionSanitization.mjs

      - name: Verify diff
        run: |
          git diff --check
          git diff -- src/app/components/PhraseAssistantPanel.tsx

      - name: Commit patched component
        run: |
          if git diff --quiet -- src/app/components/PhraseAssistantPanel.tsx; then
            echo "No component changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/PhraseAssistantPanel.tsx
          git commit -m "fix(ui): sanitize phrase review decisions and fingerprint state"
          git push origin HEAD:feat/context-aware-phrase-resolver
