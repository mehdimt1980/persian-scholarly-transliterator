name: Phase 8G staging Blob read-only check
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  blob-check:
    if: github.event.label.name == 'phase8g-run-staging-blob-readonly' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase8g/staging-blob-readonly-check'
    runs-on: ubuntu-latest
    environment: phase8g-staging-readonly
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run evidence:staging:blob-check
        env:
          PHASE8G_STAGING_BLOB_READ_WRITE_TOKEN: ${{ secrets.PHASE8G_STAGING_BLOB_READ_WRITE_TOKEN }}
          PHASE8G_STAGING_BLOB_STORE_ID: ${{ vars.PHASE8G_STAGING_BLOB_STORE_ID }}
