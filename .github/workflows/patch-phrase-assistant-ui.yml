name: Patch Phrase Assistant UI

on:
  push:
    branches:
      - feat/context-aware-phrase-resolver

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/context-aware-phrase-resolver

      - name: Apply deterministic page patch
        run: node scripts/patchPhraseAssistantPage.mjs

      - name: Verify page diff
        run: |
          git diff --check
          git diff -- src/app/page.tsx

      - name: Commit patched page
        run: |
          if git diff --quiet -- src/app/page.tsx; then
            echo "No page changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat(ui): integrate context-aware phrase resolver"
          git push origin HEAD:feat/context-aware-phrase-resolver
