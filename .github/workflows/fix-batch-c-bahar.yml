name: Fix Batch C Bahar case

on:
  push:
    branches:
      - phase4.6b/reaudit-batch-c-v2
    paths:
      - scripts/fix-batch-c-bahar.mjs
      - .github/workflows/fix-batch-c-bahar.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4.6b/reaudit-batch-c-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correct Bahar case
        run: node scripts/fix-batch-c-bahar.mjs
      - name: Commit corrected worklist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/review/reaudit-worklist.v2.json
          git diff --cached --quiet && exit 0
          git commit -m "data(validation): correct Batch C Bahar canonical"
          git push origin HEAD:phase4.6b/reaudit-batch-c-v2
