name: Apply Batch C re-audit

on:
  push:
    branches:
      - phase4.6b/reaudit-batch-c-v2
    paths:
      - scripts/apply-batch-c-reaudit.mjs
      - .github/workflows/apply-batch-c-reaudit.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4.6b/reaudit-batch-c-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Batch C decisions
        run: node scripts/apply-batch-c-reaudit.mjs
      - name: Commit updated worklist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/review/reaudit-worklist.v2.json
          git diff --cached --quiet && exit 0
          git commit -m "data(validation): record blind V2 Batch C decisions"
          git push origin HEAD:phase4.6b/reaudit-batch-c-v2
