name: Phase 8O install isolated scholarly review ledger
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  review-ledger-migration:
    if: github.event.label.name == 'phase8o-install-review-ledger' && github.event.pull_request.number == 73 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase8o/scholarly-review-workbench'
    runs-on: ubuntu-latest
    environment: phase8g-staging-import
    timeout-minutes: 8
    concurrency:
      group: phase8g-persistent-staging-writes
      cancel-in-progress: false
    env:
      PHASE8G_STAGING_DATABASE_URL: ${{ secrets.PHASE8G_STAGING_DATABASE_URL }}
      PHASE8G_STAGING_DATABASE_FINGERPRINT: ${{ vars.PHASE8G_STAGING_DATABASE_FINGERPRINT }}
      PHASE8O_REVIEW_MIGRATION_APPROVAL: CREATE_APPEND_ONLY_REVIEW_LEDGER_STAGING
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check original immutable 50-source / 75-candidate evidence corpus
        run: npm run evidence:staging:audit
      - name: Create ONLY the isolated append-only human review ledger
        run: npm run evidence:staging:review-ledger -- migrate
      - name: Verify review audit trigger and untouched evidence snapshot
        run: npm run evidence:staging:review-ledger -- verify
      - name: Final Staging evidence audit: writes stay disabled
        if: always()
        run: npm run evidence:staging:audit
